name: backend

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      # Mesmo Postgres do docker-compose.yml; os testes de banco criam o skinomics_test nele.
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skinomics
          POSTGRES_PASSWORD: skinomics
          POSTGRES_DB: skinomics
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U skinomics"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

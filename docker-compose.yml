services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skinomics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skinomics}
      POSTGRES_DB: ${POSTGRES_DB:-skinomics}
    ports:
      # Porta alta no host para não colidir com PostgreSQL instalado direto na máquina
      # (os instaladores ocupam a 5432 e, numa segunda versão, a 5433).
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skinomics}"]
      interval: 5s
      retries: 10

  app:
    build: ./backend
    environment:
      # Dentro da rede do compose o banco é o host "db", na porta interna 5432.
      SKINOMICS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skinomics}:${POSTGRES_PASSWORD:-skinomics}@db:5432/${POSTGRES_DB:-skinomics}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
